name: Semana 8 — E2E, CI y reportes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_BROWSER: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Confirmar Chrome disponible en el runner
        run: google-chrome --version
      - name: Instalación reproducible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Build de producción
        run: npm run build
      - name: Pruebas unitarias e integración con cobertura V8
        run: npm run test:coverage
      - name: Pruebas E2E en Chrome existente
        run: npx playwright test
      - name: Publicar reportes y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-08-e2e-reports
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
            coverage/
